name: Smart Service

services:
  redis:
    image: redis:8.2.5-alpine3.22
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ../../.env
      - ../../.env.development.local
    volumes:
      - redis_volume:/data:rw
      - ../redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--protected-mode", "no"]
    user: "999:999"
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw incr ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart_service_network

  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    ports:
      - "8079:80"
    env_file:
      - ../../.env
      - ../../.env.development.local
    depends_on:
      - redis
    networks:
      - smart_service_network

networks:
  smart_service_network:
    driver: bridge

volumes:
  redis_volume:
    driver: local
